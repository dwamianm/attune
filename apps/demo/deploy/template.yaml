AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Attune prototype on AWS. CloudFront serves the web app (dist/) from a private
  S3 bucket and forwards /api/* to a Lambda that runs server/lambda.ts. A
  CloudFront Function asks for a password on every request, so only people who
  have it can spend the Jev key. deploy/deploy.sh fills in the parameters,
  uploads the Lambda code, and uploads the web app.

Parameters:
  DomainName:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  CertificateArn:
    Type: String
    Description: The us-east-1 certificate from cert.yaml.
  BasicAuthToken:
    Type: String
    NoEcho: true
    Description: base64("user:password") for the site's password gate.
  OriginSecret:
    Type: String
    NoEcho: true
    Description: Sent by CloudFront in x-origin-verify; the Lambda refuses requests without it.
  JevApiKey:
    Type: String
    NoEcho: true
  JevModel:
    Type: String
    Default: jev-latest

Resources:
  # --- Web app -------------------------------------------------------------

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- API -----------------------------------------------------------------

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  Api:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Description: Attune API (server/lambda.ts)
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 512
      # Jev answers in about a second and the browser gives up at 6 s.
      Timeout: 10
      # A cap on parallel Jev spend. Each person sends about one request a second.
      ReservedConcurrentExecutions: 10
      Role: !GetAtt ApiRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          JEV_API_KEY: !Ref JevApiKey
          JEV_MODEL: !Ref JevModel
          ORIGIN_SECRET: !Ref OriginSecret
          PUBLIC_ORIGIN: !Sub "https://${DomainName}"
      Code:
        # Placeholder only. deploy.sh uploads the real bundle right after the
        # stack, and this text never changes, so stack updates keep that code.
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, body: "Deploying" });

  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Api.Arn
      # Public URL, but the app refuses any request without CloudFront's
      # x-origin-verify secret (EdgeAccess in @attune/server).
      AuthType: NONE

  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Api
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Api
      Action: lambda:InvokeFunction
      Principal: "*"
      # Only through the function URL, never a direct Invoke call.
      InvokedViaFunctionUrl: true

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-api"
        Comment: The headers the API guard reads. Not Host (the Lambda URL needs its own) and not the password.
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [content-type, origin, accept]
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: none

  # --- Front door ------------------------------------------------------------

  Gate:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-gate"
      AutoPublish: true
      FunctionConfig:
        Comment: Password gate, and one host name for the site
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var HOST = '${DomainName}';
        var AUTH = 'Basic ${BasicAuthToken}';
        function handler(event) {
          var req = event.request;
          var h = req.headers;
          // www and the CloudFront default name go to the one origin the API allows.
          if (!h.host || h.host.value !== HOST) {
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: 'https://' + HOST + req.uri } } };
          }
          if (!h.authorization || h.authorization.value !== AUTH) {
            return {
              statusCode: 401,
              statusDescription: 'Unauthorized',
              headers: {
                'www-authenticate': { value: 'Basic realm="Attune", charset="UTF-8"' },
                'cache-control': { value: 'no-store' }
              }
            };
          }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Attune prototype
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            # https://<id>.lambda-url.<region>.on.aws/ to its host name.
            DomainName: !Select [2, !Split ["/", !GetAtt ApiUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt Gate.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt Gate.FunctionMetadata.FunctionARN

  # --- DNS ---------------------------------------------------------------------

  # Z2FDTNDATAQYW2 is the fixed hosted zone ID of every CloudFront distribution.
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  FunctionName:
    Value: !Ref Api
  SiteUrl:
    Value: !Sub "https://${DomainName}"
